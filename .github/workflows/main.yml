
name: Crear APK SKUT RUN

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.4.1

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Extraer juego
        run: |
          unzip -o "SKUT_RUN_Godot(2).zip" -d proyecto
          PROJECT_FILE=$(find proyecto -name project.godot -print -quit)
          if [ -z "$PROJECT_FILE" ]; then
            echo "No se encontró project.godot"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Crear APK
        run: |
          mkdir -p build
          godot --headless --path "$PROJECT_DIR" --export-debug "Android" "$GITHUB_WORKSPACE/build/SKUT-RUN.apk"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: SKUT-RUN-APK
          path: build/SKUT-RUN.apk
