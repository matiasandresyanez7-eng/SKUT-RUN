
name: Crear APK SKUT RUN

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false

      - name: Crear APK
        run: |
          mkdir -p build
          godot --headless --path . --editor --quit

      - name: Guardar archivos
        uses: actions/upload-artifact@v4
        with:
          name: SKUT-RUN
          path: build/
